<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
<title>ccdash hub</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ccdash">
<link rel="stylesheet" href="vendor/xterm@5.5.0/xterm.css">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<header id="top">
  <a id="navback" class="btn icon" href="#/" hidden aria-label="戻る" title="戻る"></a>
  <a href="#/" class="brand">ccdash<span>hub</span></a>
  <nav id="crumbs"></nav>
  <span id="navtitle"></span>
  <button id="listtoggle" class="hbtn" type="button" hidden aria-label="セッション一覧をたたむ"></button>
  <button id="taskstoggle" class="hbtn" type="button" title="タスク" aria-label="タスク"><span class="hide-sm">タスク</span></button>
  <a id="gridlink" href="#/grid" title="動いているセッションを一覧（グリッド）"><span data-icon="grid"></span>グリッド</a>
  <a id="att" href="#/" hidden></a>
  <div id="me"></div>
</header>
<div id="restartbar" hidden></div>
<main id="view"></main>
<nav id="tabbar" aria-label="メイン">
  <a href="#/" data-tab="home"><span class="ti" data-icon="home"></span><span>ホーム</span></a>
  <a href="#/s" data-tab="sessions"><span class="ti" data-icon="list"></span><span>セッション</span></a>
  <a href="#/grid" data-tab="grid"><span class="ti" data-icon="grid"></span><span>グリッド</span></a>
  <a href="#/tasks" data-tab="tasks"><span class="ti" data-icon="tasks"></span><span>タスク</span></a>
</nav>
<div id="toast" hidden></div>
<dialog id="dlg"><div class="sheet-grab" aria-hidden="true"></div><form method="dialog" id="dlg-body"></form></dialog>
<script src="vendor/xterm@5.5.0/xterm.js"></script>
<script src="vendor/addon-fit@0.10.0/addon-fit.js"></script>
<script src="vendor/addon-web-links@0.11.0/addon-web-links.js"></script>
<script src="app.js"></script>
</body>
</html>
